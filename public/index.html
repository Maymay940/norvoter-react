<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d6efd" />
  <meta name="description" content="Система учета водосчетчиков Norvoter" />
  <title>Norvoter - Водосчетчики</title>
  <link rel="icon" type="image/svg+xml" href="/norvoter-react/favicon.svg" />
  <link rel="manifest" href="/norvoter-react/manifest.json" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script>
    // Обработка роутинга для GitHub Pages
    (function() {
      const isGitHubPages = window.location.hostname.includes('github.io');
      if (isGitHubPages) {
        const hash = window.location.hash;
        const pathname = window.location.pathname;
        
        // Если есть хэш с путем
        if (hash && hash.startsWith('#!')) {
          const newPath = hash.substring(2);
          window.history.replaceState(null, '', newPath);
        }
        // Если путь не корневой и не index.html
        else if (pathname !== '/norvoter-react/' && pathname !== '/norvoter-react/index.html') {
          const newHash = '#!' + pathname.replace('/norvoter-react', '');
          window.location.replace('/norvoter-react/?' + newHash);
        }
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
